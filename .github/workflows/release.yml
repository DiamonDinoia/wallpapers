name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      names: ${{ steps.names.outputs.names }}
      split: ${{ steps.names.outputs.split }}
      matrix: ${{ steps.names.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
      - name: Install python packages
        run: pip install numpy scipy matplotlib pillow
      - name: Render every plate
        run: python gen_wallpapers.py
      - name: Check the render is complete
        run: |
          python - <<'EOF'
          import gen_wallpapers as g
          missing = [n for n in g.NAMES
                     if not (g.OUT / f"{n}.png").exists()
                     or not (g.OUT / "thumbs" / f"{n}-thumb.png").exists()]
          assert not missing, missing
          print(len(g.NAMES), "plates and thumbnails")
          EOF
      - id: names
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, gen_wallpapers as g
          # frame-range parts for the longest videos on 4 vCPUs: dejong took 76-100 min,
          # littlewood 58 min, the next longest 19 min (runs 39646288367, 39676328235)
          split = {"dejong": 5, "littlewood": 3}
          jobs = [{"name": n, "part": k, "parts": split.get(n, 1)}
                  for n in g.NAMES for k in range(split.get(n, 1))]
          print("names=" + json.dumps(g.NAMES))
          print("split=" + json.dumps(split))
          print("matrix=" + json.dumps({"include": jobs}))
          EOF
      # gen_videos.py composites its overlays on these plates
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: plates
          path: |
            *.png
            thumbs/*.png
            *.svg
          retention-days: 7
      - name: Collect the gallery
        run: |
          mkdir site
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  videos:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 120  # hang detector: the longest part takes about 25 min
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.render.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          dpkg-query -W 'libsvtav1enc*'
          ffmpeg -hide_banner -encoders | grep libsvtav1
      - name: Install python packages
        run: pip install numpy scipy matplotlib pillow
      - uses: actions/download-artifact@v4
        with:
          name: raw
          path: raw
      - name: Render ${{ matrix.name }} part ${{ matrix.part }}/${{ matrix.parts }}
        run: python gen_videos.py ${{ matrix.name }} --cpu --part ${{ matrix.part }}/${{ matrix.parts }}
      - name: Check the video
        run: |
          set -- videos/*.webm
          test $# = 1
          f=$1 k=${{ matrix.part }} n=${{ matrix.parts }}
          want=$(( (k + 1) * 1800 / n - k * 1800 / n ))
          got=$(ffprobe -v error -select_streams v:0 -count_packets -of csv=p=0 \
                -show_entries stream=codec_name,width,height,r_frame_rate,nb_read_packets "$f")
          echo "$f: $got"
          test "$got" = "av1,1920,1080,60/1,$want"
          # largest change of mean luma between frames: dejong's periodic-window dips
          # were 6.3, the other loops stay below 0.32 (2026-10-22)
          maxdy() {
            ffmpeg -v error -xerror -i "$1" -vf "signalstats,metadata=print:key=lavfi.signalstats.YAVG:file=$2" -f null -
            awk -F= '/YAVG/ { if (n++) { d = $2 - p; d = d < 0 ? -d : d; m = d > m ? d : m } p = $2 } END { print m + 0 }' "$2"
          }
          ffmpeg -v error -f lavfi -i "color=c=0x606060:s=128x72:r=60:d=1,drawbox=c=0x404040:t=fill:enable='between(n,30,35)'" \
            -c:v libsvtav1 "$RUNNER_TEMP/dip.webm"
          dip=$(maxdy "$RUNNER_TEMP/dip.webm" "$RUNNER_TEMP/dip.y")
          awk -v d="$dip" 'BEGIN { exit !(d > 1) }' || { echo "control: a 6-frame dip gives max |dY| $dip, not above 1"; exit 1; }
          dy=$(maxdy "$f" "$RUNNER_TEMP/y")
          awk -v d="$dy" 'BEGIN { exit !(d <= 1) }' || { echo "$f flickers: max |dY| $dy above 1"; exit 1; }
          echo "$f decodes clean: av1 1920x1080 60 fps, $want frames, max |dY| $dy (control dip $dip)"
      - name: Show the ffmpeg log
        if: failure()
        run: cat /tmp/viswall-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.name }}-${{ matrix.part }}
          path: videos/
          retention-days: 7

  # one job replaces the release once every plate and video exists: a failed or
  # cancelled run leaves the previous release whole
  publish:
    needs: [render, videos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plates
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: videos
          merge-multiple: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # stream copy keeps every packet: the joined file must decode to the frames of
      # its parts in order, and the parts in reverse order must not match
      - name: Join the split videos
        env:
          SPLIT: ${{ needs.render.outputs.split }}
        run: |
          hashes() { ffmpeg -v error -i "$1" -f framemd5 - | grep -v '^#' | cut -d, -f6; }
          for n in $(jq -r 'keys[]' <<< "$SPLIT"); do
            parts=() md5s=()
            for k in $(seq 0 $(( $(jq -r --arg n "$n" '.[$n]' <<< "$SPLIT") - 1 ))); do
              parts+=("$PWD/videos/$n.part$k.webm") md5s+=("$RUNNER_TEMP/$n.$k.md5")
              hashes "${parts[-1]}" > "${md5s[-1]}"
            done
            printf "file '%s'\n" "${parts[@]}" > "$RUNNER_TEMP/$n.list"
            ffmpeg -v error -f concat -safe 0 -i "$RUNNER_TEMP/$n.list" -c copy "videos/$n.webm"
            hashes "videos/$n.webm" > "$RUNNER_TEMP/$n.md5"
            cat "${md5s[@]}" | cmp - "$RUNNER_TEMP/$n.md5"
            printf '%s\n' "${md5s[@]}" | tac | xargs cat > "$RUNNER_TEMP/$n.rev"
            cmp -s "$RUNNER_TEMP/$n.rev" "$RUNNER_TEMP/$n.md5" && exit 1
            got=$(ffprobe -v error -select_streams v:0 -count_packets -of csv=p=0 \
                  -show_entries stream=codec_name,width,height,r_frame_rate,nb_read_packets "videos/$n.webm")
            test "$got" = "av1,1920,1080,60/1,1800"
            rm "${parts[@]}"
            echo "$n: ${#parts[@]} parts joined, $got, frame hashes match the parts in order, not in reverse"
          done
      - name: Check the release set
        env:
          NAMES: ${{ needs.render.outputs.names }}
        run: |
          want=$(jq length <<< "$NAMES")
          for n in $(jq -r '.[]' <<< "$NAMES"); do
            test -s "$n.png" && test -s "thumbs/$n-thumb.png" && test -s "videos/$n.webm" || { echo "missing $n"; exit 1; }
          done
          test -s videos/captions.txt
          compgen -G 'videos/*.part*.webm' && exit 1
          echo "$want plates, thumbnails and videos, plus captions.txt"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest --title "4K wallpapers" --target "$GITHUB_SHA" --notes \
            "Thirteen 3840x2160 PNG plates, their 960x540 thumbnails, the SVG sources for
          the line-art plates, and thirteen 1920x1080 60 fps AV1 loops for the Flatiron
          viswall with their captions.txt. Rendered by \`gen_wallpapers.py\` and
          \`gen_videos.py --cpu\` at ${GITHUB_SHA:0:7}.

          The README gallery links here, so this release is replaced on every push to main." \
            ./*.png thumbs/*.png ./*.svg videos/*.webm videos/captions.txt

  # DiamonDinoia/apt serves the deb from the `builds` release bit-identical, pinned to
  # the digest GitHub reports, so the served package is the one this job tested
  deb:
    needs: render
    if: github.ref == 'refs/heads/main'  # the version counts main's commits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version counts the commits
      - uses: actions/download-artifact@v4
        with:
          name: plates
          path: plates
      - name: Build the deb
        env:
          NAMES: ${{ needs.render.outputs.names }}
        run: |
          mapfile -t plates < <(jq -r '.[] | "plates/\(.).png"' <<< "$NAMES")
          deb/build.sh out "${plates[@]}"
      - name: Install and test it under Plasma in debian:sid and debian:trixie
        run: |
          deb/test.sh out/*.deb
          IMAGE=docker.io/library/debian:trixie deb/test.sh out/*.deb
      - name: Publish the deb on the builds release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- out/*.deb
          test $# = 1
          deb=$1 name=$(basename "$1")
          gh release view builds > /dev/null 2>&1 ||
            gh release create builds --latest=false --title "deb builds" --notes "Built debs for DiamonDinoia/apt. Do not delete."
          # a re-run of an older commit must not replace a newer deb
          v=${name#diamondinoia-wallpapers_} v=${v%_all.deb}
          for old in $(gh release view builds --json assets --jq '.assets[].name'); do
            o=${old#diamondinoia-wallpapers_} o=${o%_all.deb}
            if dpkg --compare-versions "$o" gt "$v"; then echo "builds holds $old, newer than $name"; exit 1; fi
          done
          gh release upload builds "$deb" --clobber
          remote=$(gh release view builds --json assets --jq ".assets[] | select(.name == \"$name\") | .digest")
          test "$remote" = "sha256:$(sha256sum "$deb" | cut -d' ' -f1)"
          # the apt repository keeps its own copy, so only the newest deb stays here
          gh release view builds --json assets --jq '.assets[].name' | grep -vxF "$name" |
            xargs -r -n1 gh release delete-asset builds --yes
          echo "$name published, digest $remote matches the tested bytes"

  pages:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
