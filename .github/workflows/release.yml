name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
      - name: Install python packages
        run: pip install numpy scipy matplotlib pillow
      - name: Render every plate
        run: python gen_wallpapers.py
      - name: Check the render is complete
        run: |
          python - <<'EOF'
          import gen_wallpapers as g
          missing = [n for n in g.NAMES
                     if not (g.OUT / f"{n}.png").exists()
                     or not (g.OUT / "thumbs" / f"{n}-thumb.png").exists()]
          assert not missing, missing
          print(len(g.NAMES), "plates and thumbnails")
          EOF
      - id: names
        run: python -c "import json, gen_wallpapers as g; print('names=' + json.dumps(g.NAMES))" >> "$GITHUB_OUTPUT"
      # gen_videos.py composites its overlays on these plates
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw/
          retention-days: 1
      - name: Collect the gallery
        run: |
          mkdir site
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --title "4K wallpapers" --target "$GITHUB_SHA" --notes \
            "Thirteen 3840x2160 PNG plates, their 960x540 thumbnails, and the SVG sources
          for the line-art plates. Rendered by \`gen_wallpapers.py\` at ${GITHUB_SHA:0:7}.

          The videos job adds thirteen 1920x1080 60 fps AV1 loops for the Flatiron viswall
          and their captions.txt, made by \`gen_videos.py --cpu\` about two hours later.

          The README gallery links here, so this release is replaced on every push to main." \
            *.png thumbs/*.png *.svg

  videos:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 4 vCPUs: littlewood and dejong take about 2 h
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.render.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep libsvtav1
      - name: Install python packages
        run: pip install numpy scipy matplotlib pillow
      - uses: actions/download-artifact@v4
        with:
          name: raw
          path: raw
      - name: Render ${{ matrix.name }}
        run: python gen_videos.py ${{ matrix.name }} --cpu
      - name: Check the video
        run: |
          f=videos/${{ matrix.name }}.webm
          got=$(ffprobe -v error -select_streams v:0 -count_packets -of csv=p=0 \
                -show_entries stream=codec_name,width,height,r_frame_rate,nb_read_packets "$f")
          echo "$f: $got"
          test "$got" = "av1,1920,1080,60/1,1800"
          ffmpeg -v error -xerror -i "$f" -f null -
          echo "$f decodes clean: av1 1920x1080 60 fps, 1800 frames"
      - name: Show the ffmpeg log
        if: failure()
        run: cat /tmp/viswall-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.name }}
          path: videos/
          retention-days: 1

  release-videos:
    needs: [render, videos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: videos
          merge-multiple: true
      - name: Attach the videos to the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: ${{ needs.render.outputs.names }}
        run: |
          want=$(jq length <<< "$NAMES")
          webm=(videos/*.webm)
          got=${#webm[@]}
          echo "$got of $want videos"
          test "$got" = "$want"
          test -s videos/captions.txt
          gh release upload latest videos/*.webm videos/captions.txt --repo "$GITHUB_REPOSITORY" --clobber

  pages:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
